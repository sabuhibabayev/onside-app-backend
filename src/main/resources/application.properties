
spring.application.name=stadium-reservation
server.port=8080

# PostgreSQL Konfiqurasiyasi (Sizin portunuzla: 54032)
spring.datasource.url=jdbc:postgresql://localhost:54032/stadiumdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate Ayarlari
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
springdoc.show-actuator=true
springdoc.override-with-generic-response=true
